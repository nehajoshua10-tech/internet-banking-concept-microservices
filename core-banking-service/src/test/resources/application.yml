spring:
  application:
    name: core-banking-service
  datasource:
    url: jdbc:h2:mem:banking_core_service
    username: root
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
  cloud:
    config:
      enabled: false

server:
  port: 8092

eureka:
  client:
    enabled: false

info:
  app:
    name: ${spring.application.name}
