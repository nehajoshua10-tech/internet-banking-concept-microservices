spring:
  application:
    name: internet-banking-api-gateway
  # Do not attempt to contact the Spring Cloud Config server during tests.
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
    # The gateway is not expected to reach Eureka while the context is loading in tests.
    discovery:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            scope: openid
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            authorization-uri: http://localhost:0/realms/test/protocol/openid-connect/auth
            token-uri: http://localhost:0/realms/test/protocol/openid-connect/token
            jwk-set-uri: http://localhost:0/realms/test/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/realms/test/protocol/openid-connect/certs

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
